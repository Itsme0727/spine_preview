<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Spine Animation State Machine</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="css/styles.css?v=20260611" />
</head>
<body>
    <!-- ===== 画布层 ===== -->
    <div id="app">
        <canvas id="gridCanvas"></canvas>
        <canvas id="connCanvas"></canvas>
        <div id="nodesLayer"></div>
        <div id="floatLabels"></div>
    </div>

    <!-- ===== 鸟瞰图（左下角小地图）===== -->
    <div id="minimap">
        <canvas id="minimapCanvas"></canvas>
        <div id="minimapViewport"></div>
    </div>

    <!-- ===== 工具栏 ===== -->
    <div id="toolbar">
        <button onclick="SMTool.addSpineNode()">➕ 添加节点</button>
        <span class="sep"></span>
        <button id="btnTestLayerSort" style="background:#ff6b6b;color:#fff;font-weight:700;" onclick="alert('SMTool._layerMoveBy='+typeof SMTool._layerMoveBy);var ln=null;var it=SMData.nodes.values();var r=it.next();while(!r.done){if(r.value.nodeType==='layer'){ln=r.value;break;}r=it.next();}if(ln){SMTool._layerMoveBy(ln.id,1,1);}else{alert('没有层级节点，请先右键添加');}">🔧 测试排序</button>
        <span class="sep"></span>
        <button id="btnConnect" onclick="SMTool.toggleConnectMode()">🔗 连线模式</button>
        <span class="sep"></span>
        <button onclick="SMTool.fitAll()">📐 适合视图</button>
        <button onclick="SMTool.resetView()">🏠 重置视图</button>
        <span class="sep"></span>
        <button id="btnGrid" class="active" onclick="SMTool.toggleGrid()">📏 网格</button>
        <button onclick="SMTool.exportData()">💾 导出</button>
        <button onclick="SMTool.exportAsZip()" style="background:#f59e0b;color:#fff">📦 导出ZIP</button>
        <button onclick="SMTool.importData()">📥 导入</button>
        <button onclick="SMTool.exportAIJson()" style="background:#10b981;color:#fff">🤖 导出AI</button>
        <span class="sep"></span>
        <button id="btnTestLayer" onclick="SMTool._testLayerPreviewDirect()" style="background:#7c5ce7;color:#fff">🧪 测试层级叠加</button>
    </div>

    <!-- ===== 显示/隐藏切换按钮（左上角） ===== -->
    <div id="viewToggles">
        <button id="btnToggleLabels" class="vt-btn vt-green active" onclick="SMTool._toggleHideLabels()" title="隐藏标题：隐藏节点顶部的翻译标题和状态名">📝 标题</button>
        <button id="btnToggleBubbles" class="vt-btn vt-purple active" onclick="SMTool._toggleHideBubbles()" title="隐藏特效：隐藏关键帧事件气泡提示">💬 特效</button>
        <button id="btnToggleBoneImgs" class="vt-btn vt-pink active" onclick="SMTool._toggleHideBoneImgs()" title="挂点图：隐藏骨骼上挂载的图片">🖼️ 挂点</button>
        <button id="btnToggleIndicators" class="vt-btn vt-yellow active" onclick="SMTool._toggleHideIndicators()" title="标记：显示/隐藏节点左上角标记图标">🏷️ 标记</button>
    </div>

    <!-- ===== 对齐排版工具栏（多选 ≥2 时显示）===== -->
    <div id="alignBar" style="display:none">
        <button title="横向-居上对齐" onclick="SMTool.alignTop()">⊤ 上</button>
        <button title="横向-居中对齐" onclick="SMTool.alignMidH()">⊟ 中</button>
        <button title="横向-居下对齐" onclick="SMTool.alignBottom()">⊥ 下</button>
        <span class="sep"></span>
        <button title="竖向-靠左对齐" onclick="SMTool.alignLeft()">⊏ 左</button>
        <button title="竖向-居中对齐" onclick="SMTool.alignMidV()">⊞ 中</button>
        <button title="竖向-靠右对齐" onclick="SMTool.alignRight()">⊐ 右</button>
        <span class="sep"></span>
        <button title="横向平均分布" onclick="SMTool.distributeH()">↔ 横</button>
        <button title="竖向平均分布" onclick="SMTool.distributeV()">↕ 竖</button>
        <span class="sep"></span>
        <span class="gap-wrap">
            <button class="gap-btn" onclick="SMTool._gapStep(-1)" title="减少间距">◀</button>
            <input type="number" id="gapInput" placeholder="间距" min="0" value="200" onkeydown="if(event.key==='Enter')SMTool.applyGapDistribute()">
            <button class="gap-btn" onclick="SMTool._gapStep(1)" title="增加间距">▶</button>
        </span>
        <button onclick="SMTool.applyGapDistribute()" title="按指定间距分布">确定</button>
        <span class="sep"></span>
        <button id="btnSnap" class="active" onclick="SMTool.toggleSnap()" title="吸附对齐">🧲 吸附</button>
    </div>

    <!-- ===== 缺失状态通知面板 ===== -->
    <div id="missingPanel">
        <div class="mp-header">⚠️ 缺失状态<button class="mp-close" onclick="SMTool._closeMissingPanel()" title="关闭提示">✕</button></div>
        <div class="mp-list" id="missingList"></div>
    </div>

    <!-- ===== 拖拽提示 ===== -->
    <div id="dropZone">
        <div class="inner">
            <div class="icon">📂</div>
            拖拽 Spine 文件到此处
            <br /><span class="sub">需要 .json/.skel + .atlas + .png</span>
            <br /><span class="sub" style="margin-top:6px;color:#ffd966">也可拖入导出的 .json 项目文件快速导入</span>
        </div>
    </div>

    <!-- ===== 条件编辑器 ===== -->
    <div id="conditionEditor">
        <label style="font-size:11px;color:var(--text2);display:block;margin-bottom:6px">过渡条件：</label>
        <textarea id="condInput" placeholder="例如：isDead == true" rows="1"></textarea>
        <div class="actions">
            <button class="del" onclick="SMTool.deleteConnection()">删除连线</button>
            <button class="ok" onclick="SMTool.saveCondition()">确定</button>
        </div>
    </div>

    <!-- ===== 右键菜单 ===== -->
    <div id="ctxMenu">
        <div class="ctx-item" onclick="SMTool.ctxDeleteNode()">🗑️ 删除节点</div>
        <div class="ctx-item" onclick="SMTool.ctxDuplicateNode()">📋 复制节点</div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" onclick="SMTool.ctxAddTitle()">📝 标题</div>
        <div class="ctx-item" onclick="SMTool.ctxInsertImage()">🖼️ 插入图片</div>
    </div>

    <!-- ===== 标签悬浮提示 ===== -->
    <div id="labelTooltip"></div>

    <!-- ===== 重复文件替换弹窗 ===== -->
    <div id="dupReplaceDialog">
        <div class="dup-overlay" onclick="event.stopPropagation()"></div>
        <div class="dup-box">
            <div class="dup-title">⚠️ 检测到重复动画文件</div>
            <div class="dup-body">
                <p>工程中已存在动画文件 "<strong id="dupFileName"></strong>"。</p>
                <p>请选择操作：</p>
            </div>
            <div class="dup-actions">
                <button class="dup-btn-replace" id="dupBtnReplace">🔄 替换动画<br><span>仅刷新 Spine 画面数据，保留所有标记/截图/参数</span></button>
                <button class="dup-btn-new" id="dupBtnNew">➕ 新建动画<br><span>作为新的独立节点添加到画布</span></button>
            </div>
            <button class="dup-close" id="dupBtnClose" title="取消">✕</button>
        </div>
    </div>

    <!-- ===== 状态栏 ===== -->
    <div id="statusBar">
        <span id="sbNodes">节点: 0</span>
        <span id="sbConns">连线: 0</span>
        <span id="sbBones">骨骼: 0</span>
        <span id="sbDraws">Draw call: 0</span>
        <span id="sbFPS">FPS: --</span>
        <span id="sbMemory">内存: --</span>
        <span id="sbStatus"></span>
    </div>

    <!-- ===== 自动保存提示气泡（左下角） ===== -->
    <div id="autoSaveToast">
        <span class="ast-icon">💾</span>
        <span class="ast-text">已自动保存</span>
    </div>

    <!-- ===== 渲染模式切换 ===== -->
    <div id="modeToggle">
        <button id="modeStatic" class="active" onclick="SMTool.setRenderMode('static')">静态</button>
        <button id="modePerf" onclick="SMTool.setRenderMode('perf')">性能</button>
        <button id="modeDyn" onclick="SMTool.setRenderMode('dyn')">动态</button>
    </div>

    <!-- ===== 缩放控件 ===== -->
    <div id="zoomControl">
        <input type="range" id="zoomSlider" min="0" max="200" value="100">
        <span id="zoomLabel">100%</span>
    </div>
    <button id="zoomResetBtn" onclick="SMTool.resetView()" style="display:none" title="恢复到 100%">世界中心 100%</button>

    <!-- ===== 左侧数据浮窗面板 ===== -->
    <div id="dataFloatPanel">
        <div class="dfp-trigger-icon" title="固定面板">
            <span class="dfp-pin">📌</span>
        </div>
        <div class="dfp-body">
            <div class="dfp-header">
                <span class="dfp-title">📋 动画数据</span>
            </div>
            <div class="dfp-tabs" id="dfpTabs"></div>
            <div class="dfp-content" id="dfpContent">
                <div class="dfp-hint">点击一个 Spine 节点以查看其动画数据</div>
            </div>
            <div class="dfp-footer" id="dfpFooter"></div>
        </div>
    </div>

    <!-- ===== 右上角动画预览浮窗面板 ===== -->
    <div id="animPreviewPanel" style="display:none">
        <div class="app-header">
            <span class="app-title" id="appTitle">🎬 动画预览</span>
            <span class="app-close" title="关闭预览" onclick="SMTool._hideAnimPreview()">✕</span>
        </div>
        <div class="app-canvas-wrap">
            <canvas id="appCanvas"></canvas>
            <div class="app-zoom-bar" id="appZoomBar">
                <span class="app-zoom-label" id="appZoomLabel">100%</span>
                <button class="app-zoom-reset" id="appZoomReset" title="恢复 100%" onclick="SMTool._resetAnimPreviewZoom()">1:1</button>
            </div>
        </div>
        <div class="app-resize-handle"></div>
    </div>

    <!-- ===== 底部动画组合浮窗面板 ===== -->
    <div id="flowPanel">
        <div class="flp-trigger-bar" title="展开/收起动画组合">
            <span class="flp-trigger-label">动画组合</span>
        </div>
        <div class="flp-body">
            <div class="flp-header">
                <div id="flowModeToggle">
                    <button id="flowModeFull" class="active" onclick="SMTool.setFlowMode('full')">完整-动画流</button>
                    <button id="flowModeThree" onclick="SMTool.setFlowMode('three')">三层-动画流</button>
                </div>
                <span class="flp-maximize" title="最大化面板">▲</span>
                <span class="flp-title">🔗 动画组合</span>
                <span class="flp-pin" title="固定面板">📌</span>
            </div>
            <div class="flp-content" id="flpContent">
                <div class="flp-hint">点击选中一个动画节点，查看其上下游动画组合</div>
            </div>
        </div>
    </div>

    <!-- ================================================================
         脚本加载顺序（依赖关系严格）:
         1. spine-loader.js — 从 CDN 加载三个版本 Spine 运行时
         2. data-model.js  — 全局状态 SMData + SpineNodeData 类
         3. spine-loading.js — 文件读取/解析/版本检测
         4. spine-rendering.js — WebGL 渲染器 + 视口变换
         5. grid-connections.js — 网格背景 + 贝塞尔连线
         6. minimap.js — 左下角鸟瞰图小地图
         7. ui-dom.js — 节点 DOM 创建/更新
         8. interaction.js — 鼠标/键盘事件处理
         9. export-import.js — 项目导出/导入
        10. app.js — 主入口（汇总 + 初始化）
         ================================================================ -->
    <script src="js/lib/spine-loader.js?v=20260609"></script>
    <script src="js/data-model.js?v=20260609"></script>
    <script src="js/spine-loading.js?v=20260609"></script>
    <script src="js/spine-rendering.js?v=20260611"></script>
    <script src="js/grid-connections.js?v=20260609"></script>
    <script src="js/minimap.js?v=20260609"></script>
    <script src="js/ui-dom.js?v=20260611"></script>
    <script src="js/interaction.js?v=20260609"></script>
    <script src="js/export-import.js?v=20260611"></script>
    <script src="js/export-ai-json.js?v=20260609"></script>
    <script src="js/layer-node-v2.js?v=20260611"></script>
    <script src="js/app.js?v=20260611"></script>
</body>
</html>
